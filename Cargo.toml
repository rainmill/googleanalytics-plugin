[package]
name = "rainmill-googleanalytics"
version = "0.1.0"
description = "Google Analytics 4 for Laterite: the property's traffic, sources, pages and events on the admin dashboard, and a tracker component with an open consent seam"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rainmill/googleanalytics-plugin"
publish = false

# Marks this crate as a Laterite plugin and names the module it registers, so a
# tool can tell what it is without building it. Which Laterite it supports is
# stated by the dependency requirement below, never repeated here.
[package.metadata.laterite]
plugin = "rainmill.googleanalytics"

[dependencies]
# Laterite crates are version-only so this manifest is location-independent
# (identical whether dev-symlinked under an app's plugins/ tree or vendored).
laterite-core = "0.12"
laterite-admin = "0.12"
# The tracker component for the site's theme.
laterite-web = "0.12"
# Holds the service account key and the property.
rainmill-vault = "0.1"
# The data source contract and the dashboard the plugin ships.
rainmill-reporting = "0.1"
# Calls the Google Analytics Data API and Google's token endpoint.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Signs the service account's token request (RS256).
rsa = { version = "0.9", features = ["sha2"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tracing = "0.1"

[dev-dependencies]
laterite-core = { version = "0.12", features = ["sqlite", "postgres", "testing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
